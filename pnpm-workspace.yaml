# body-parser <2.4.0 (pulled in by @modelcontextprotocol/sdk → express) has a DoS advisory
# (GHSA-27r3-jxmh-p828). We don't use the SDK's express adapter, but pin the patched version anyway.
overrides:
  body-parser: '>=2.4.0'

# pnpm 12 fails non-interactive installs (Docker, CI) on unreviewed install scripts.
# esbuild ships its binary as a platform-specific optional package, so its script isn't needed.
allowBuilds:
  esbuild: false
