name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome (lint + format check)
        run: pnpm exec biome ci .

  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (strict, incl. scripts and tests)
        run: pnpm exec tsc --noEmit --noUnusedLocals --noUnusedParameters
      - name: Build
        run: pnpm build
      - name: Docker image (what Railway deploys)
        run: docker build -t sales-rescue:ci .

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sales_rescue
          POSTGRES_PASSWORD: sales_rescue
          POSTGRES_DB: sales_rescue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sales_rescue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sales_rescue:sales_rescue@localhost:5432/sales_rescue_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vitest (domain + hardening)
        run: pnpm test
